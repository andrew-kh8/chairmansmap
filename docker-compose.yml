services:
  redis:
    image: redis:7-alpine
    container_name: chairmansmap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs:4.40
    container_name: chairmansmap-seaweedfs-master
    command: master -ip.bind=0.0.0.0 -port=9333
    ports:
      - "9333:9333"
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.40
    container_name: chairmansmap-seaweedfs-volume
    command: volume -mserver=chairmansmap-seaweedfs-master:9333 -ip.bind=0.0.0.0
    volumes:
      - seaweedfs-data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.40
    container_name: chairmansmap-seaweedfs-filer
    command: filer -master=chairmansmap-seaweedfs-master:9333 -s3 -s3.config=/data/s3.json -port=8888
    ports:
      - "8333:${S3_PORT}"
      - "8888:8888"
    volumes:
      - ./s3.json:/data/s3.json:ro
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    restart: unless-stopped

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.40
    container_name: chairmansmap-seaweedfs-admin
    command: admin -master=chairmansmap-seaweedfs-master:9333 -port=23646 -adminUser=${AWS_ACCESS_KEY_ID} -adminPassword=${AWS_SECRET_ACCESS_KEY}
    ports:
      - "23646:23646"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
      - seaweedfs-filer
    restart: unless-stopped

  postgres:
    image: postgis/postgis:latest
    container_name: chairmansmap-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  seaweedfs-data:
